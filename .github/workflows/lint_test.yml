name: "Lint CI"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [22.x]
        ruby: [3.4.9]

    env:
      RAILS_ENV: test
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: Install dependencies
        run: |
          bundle install
          yarn install --frozen-lockfile --non-interactive --prefer-offline

      - name: Build i18n libraries
        run: bundle exec rake react_on_rails:locale

      - name: Generate React on Rails packs
        run: bundle exec rails react_on_rails:generate_packs

      - name: Run lint
        run: bundle exec rake lint
