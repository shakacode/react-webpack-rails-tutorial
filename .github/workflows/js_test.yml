name: "JS CI"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [22.x]
        ruby: [3.4.6]

    env:
      RAILS_ENV: test
      NODE_ENV: test
      USE_COVERALLS: true

    steps:
      - name: Checkout code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: Install dependencies
        run: |
          bundle install
          yarn install --frozen-lockfile --non-interactive --prefer-offline

      - name: Build i18n libraries
        run: bundle exec rake react_on_rails:locale

      - name: Generate React on Rails packs
        run: bundle exec rails react_on_rails:generate_packs

      - name: Run js tests
        run: bundle exec rake ci:js
