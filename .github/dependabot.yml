version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Staging, cleanup, help, and promotion stay on the reviewed v5.2.0 cohort
    # until that migration is reviewed on its own. See Version Locking in
    # .github/cpflow-help.md.
    ignore:
      - dependency-name: shakacode/control-plane-flow/.github/workflows/cpflow-cleanup-stale-review-apps.yml
      - dependency-name: shakacode/control-plane-flow/.github/workflows/cpflow-deploy-staging.yml
      - dependency-name: shakacode/control-plane-flow/.github/workflows/cpflow-help-command.yml
      - dependency-name: shakacode/control-plane-flow/.github/workflows/cpflow-review-app-help.yml
      - dependency-name: shakacode/control-plane-flow/.github/actions/cpflow-detect-release-phase
      - dependency-name: shakacode/control-plane-flow/.github/actions/cpflow-setup-environment
      - dependency-name: shakacode/control-plane-flow/.github/actions/cpflow-validate-config
      - dependency-name: shakacode/control-plane-flow/.github/actions/cpflow-wait-for-health
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    groups:
      react-on-rails-family:
        patterns:
          - react_on_rails
          - react_on_rails_pro
      all-dependencies:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      react-on-rails-family:
        patterns:
          - react-on-rails-pro
          - react-on-rails-pro-node-renderer
          - react-on-rails-rsc
          - rescript-react-on-rails
      all-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "@babel/cli"
        versions:
          - ">= 8.0.0"
      - dependency-name: "@babel/core"
        versions:
          - ">= 8.0.0"
      - dependency-name: "@babel/plugin-transform-runtime"
        versions:
          - ">= 8.0.0"
      - dependency-name: "@babel/preset-env"
        versions:
          - ">= 8.0.0"
      - dependency-name: "@babel/runtime"
        versions:
          - ">= 8.0.0"
      - dependency-name: "@babel/eslint-parser"
        versions:
          - ">= 8.0.0"
      - dependency-name: "@babel/preset-react"
        versions:
          - ">= 8.0.0"
